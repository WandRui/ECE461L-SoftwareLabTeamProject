services:
  # Flask Backend
  - type: web
    name: hardware-lab-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: hardware_lab_system
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # React Frontend
  - type: web
    name: hardware-lab-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
